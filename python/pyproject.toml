[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "grafen"
version = "0.1.0"
description = "Python port of GRAFEN: magnetic forward modelling with self-demagnetization"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "numba>=0.57",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["grafen*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
